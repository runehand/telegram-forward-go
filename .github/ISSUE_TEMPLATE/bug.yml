name: Bug report
about: Report a defect/regression
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Severity, users affected
